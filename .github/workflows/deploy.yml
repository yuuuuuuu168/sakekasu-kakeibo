# main へのマージでリソースをデプロイする。
# 認証はアクセスキーではなく GitHub OIDC を使う。リポジトリにアクセスキーは置かない。
#
# アプリ本体のスタックは cdkd（CloudFormation を通さず AWS の API を直接叩く CDK の
# デプロイツール）で出す。ロールは 2 つを使い分ける。
#
# - deploy ロール（sakekasu-kakeibo-github-oidc スタック。手で入れる）
#   cdkd 用ロールのスタックを CloudFormation で入れるのと、フロントの配信に使う
# - cdkd ロール（sakekasu-kakeibo-cdkd-deploy スタック。このワークフローが入れる）
#   cdkd がアプリ本体を作る・変えるのに使う。理由は infra/lib/cdkd-deploy-stack.ts
#
# CloudFormation から cdkd への移行は infra/scripts/migrate-to-cdkd.sh が初回に済ませる。
#
# ジョブを 2 つに分けているのは、フロントのビルドに AWS の認証情報を持ち込まないため。
# ビルドにはスタックの出力（API の URL、共通ログインの値）が要るので、infra ジョブの
# 出力として受け渡し、ビルドが終わってから配信用の認証情報を入れる。
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'packages/**'
      - 'src/**'
      - 'theme/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      env:
        description: デプロイ先の環境
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

# デプロイの同時実行を防ぐ。後続を打ち切らないのは、最後の main の状態を必ず
# 反映させるため（キャンセルすると古い状態のまま止まる恐れがある）
concurrency:
  group: deploy-${{ inputs.env || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  DEPLOY_ROLE: arn:aws:iam::<アプリのアカウント ID>:role/sakekasu-kakeibo-github-actions-deploy
  CDKD_ROLE: arn:aws:iam::<アプリのアカウント ID>:role/sakekasu-kakeibo-github-actions-cdkd
  TARGET_ENV: ${{ inputs.env || 'dev' }}

jobs:
  infra:
    name: インフラのデプロイ
    runs-on: ubuntu-latest
    outputs:
      apiUrl: ${{ steps.outputs.outputs.apiUrl }}
      userPoolId: ${{ steps.outputs.outputs.userPoolId }}
      userPoolClientId: ${{ steps.outputs.outputs.userPoolClientId }}
      authDomain: ${{ steps.outputs.outputs.authDomain }}
      siteBucket: ${{ steps.outputs.outputs.siteBucket }}
      distributionId: ${{ steps.outputs.outputs.distributionId }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 依存の取得とテストは AWS の認証情報を入れる前に済ませる。
      #
      # npm のライフサイクルスクリプトはインストール時に任意のコードを実行できる。
      # 認証後に npm ci を走らせると、依存のどれか 1 つが乗っ取られただけで、
      # そのスクリプトが AWS_SESSION_TOKEN を読んで cdk-hnb659fds-* ロールへ
      # assume できてしまう（このロールは CloudFormation を自由に操作できる）。
      # 認証前に済ませておけば、スクリプトが走っても掴めるものが無い。
      # そのうえで --ignore-scripts も付ける（多層で塞ぐ）。
      #
      # ルート側も入れるのは、Lambda のバンドルが packages/core を辿るため
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: infra

      # デプロイ直前の最後の関門。test ワークフローと重なるが、そちらは paths 条件や
      # マージの経路によっては走らないことがある。出す手前で必ず 1 回通す
      - run: npm test
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # cdkd 用ロールのスタック。ここだけは CloudFormation で入れる（理由は
      # infra/lib/cdkd-deploy-stack.ts）。変更が無ければ数秒で抜ける
      - name: cdkd 用ロールを入れる
        working-directory: infra
        run: npx cdk deploy sakekasu-kakeibo-cdkd-deploy -c cdkd-deploy=true --require-approval never

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.CDKD_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # 状態を置く S3 バケットと、Lambda のコードを置く場所を作る。初回だけ動く。
      # 証明書の -cert スタックが us-east-1 にあるので、そちらにも置き場所を作る
      - name: cdkd bootstrap
        working-directory: infra
        run: |
          set -euo pipefail
          bucket="cdkd-state-$(aws sts get-caller-identity --query Account --output text)"
          for region in ap-northeast-1 us-east-1; do
            if ! aws s3api head-object --bucket "$bucket" --key "cdkd-bootstrap/${region}.json" >/dev/null 2>&1; then
              npx cdkd bootstrap --region "$region"
            fi
          done

      - name: CloudFormation から cdkd へ移す
        id: migrate
        working-directory: infra
        run: bash scripts/migrate-to-cdkd.sh

      - name: cdkd deploy
        if: steps.migrate.outputs.engine == 'cdkd'
        working-directory: infra
        run: npx cdkd deploy --all --yes -c env=${{ env.TARGET_ENV }}

      # 移行の前検査で引っかかったときだけ通る。スタックはまだ CloudFormation の管理下に
      # あるので、これまでどおり出す。cdkd ロールでも bootstrap ロールを引き受けられる
      - name: cdk deploy（cdkd へ移せなかったとき）
        if: steps.migrate.outputs.engine == 'cfn'
        working-directory: infra
        run: npx cdk deploy --all --require-approval never -c env=${{ env.TARGET_ENV }}

      # 出力は cdkd の状態から読む。移せなかったときは CloudFormation から読む
      - name: スタックの出力を読む
        id: outputs
        working-directory: infra
        env:
          ENGINE: ${{ steps.migrate.outputs.engine }}
        run: |
          set -euo pipefail
          prefix="sakekasu-kakeibo-${TARGET_ENV}"
          read_output() {
            local value
            if [ "$ENGINE" = cdkd ]; then
              value="$(npx cdkd state show "$1" --stack-region "$AWS_REGION" --json | jq -r --arg k "$2" '.state.outputs[$k] // empty')"
            else
              value="$(aws cloudformation describe-stacks --stack-name "$1" \
                --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text)"
            fi
            if [ -z "$value" ] || [ "$value" = None ]; then
              echo "$1 の出力 $2 が読めません" >&2
              exit 1
            fi
            echo "$value"
          }
          # 一度変数に受ける。echo の引数の中で失敗しても set -e は効かず、空のまま進んでしまう
          api_url="$(read_output "$prefix-api" ApiUrl)"
          # ログインは共通のユーザープール（cdk.json の sharedAuth）。API スタックが
          # JWT の検証に使っているのと同じ値を出しているので、そこから読む。
          # 旧ユーザープールの -auth スタックの出力はもう使わない
          user_pool_id="$(read_output "$prefix-api" AuthUserPoolId)"
          user_pool_client_id="$(read_output "$prefix-api" AuthClientId)"
          auth_domain="$(read_output "$prefix-api" AuthDomain)"
          site_bucket="$(read_output "$prefix-site" SiteBucketName)"
          distribution_id="$(read_output "$prefix-site" DistributionId)"
          {
            echo "apiUrl=$api_url"
            echo "userPoolId=$user_pool_id"
            echo "userPoolClientId=$user_pool_client_id"
            echo "authDomain=$auth_domain"
            echo "siteBucket=$site_bucket"
            echo "distributionId=$distribution_id"
          } >> "$GITHUB_OUTPUT"

  site:
    name: フロントの配信
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # ビルドはまだ認証情報を入れない状態で走らせる。Vite のプラグインも
      # 依存のコードなので、掴めるものを置かない
      - name: ビルド
        env:
          VITE_API_URL: ${{ needs.infra.outputs.apiUrl }}
          VITE_USER_POOL_ID: ${{ needs.infra.outputs.userPoolId }}
          VITE_USER_POOL_CLIENT_ID: ${{ needs.infra.outputs.userPoolClientId }}
          VITE_AUTH_DOMAIN: ${{ needs.infra.outputs.authDomain }}
        run: |
          set -euo pipefail
          # 1 つでも欠けると画面はローカルモード（localStorage）で配信されてしまうので止める
          for name in VITE_API_URL VITE_USER_POOL_ID VITE_USER_POOL_CLIENT_ID VITE_AUTH_DOMAIN; do
            test -n "${!name}" || { echo "$name が取れていません" >&2; exit 1; }
          done
          npx vite build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # ハッシュ付きの資産は長く持たせ、index.html だけ都度読み直させる
      - name: S3 へ同期して無効化
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${{ needs.infra.outputs.siteBucket }}/" \
            --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ needs.infra.outputs.siteBucket }}/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "${{ needs.infra.outputs.distributionId }}" --paths "/index.html"
